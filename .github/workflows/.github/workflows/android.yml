
name: Build GRIHAMAKER APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GRIHAMAKER_GitHub_Source.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project
        run: unzip -q GRIHAMAKER_GitHub_Source.zip -d extracted

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p extracted/GRIHAMAKER_AndroidStudio --no-daemon assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GRIHAMAKER-Native-APK
          path: extracted/GRIHAMAKER_AndroidStudio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
